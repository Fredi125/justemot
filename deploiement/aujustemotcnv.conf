# =============================================================================
#  Au juste mot — La CNV appliquée   (application statique / PWA)
#  Domaine dédié : justemotcnv.com — isolé des autres sites par server_name.
#  Ce fichier n'affecte AUCUN autre vhost. Bloc HTTP (port 80) uniquement ;
#  certbot --nginx ajoutera automatiquement le bloc HTTPS (443) + la redirection.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name justemotcnv.com www.justemotcnv.com;

    root /var/www/aujustemotcnv;
    index index.html;

    # Journaux dédiés (n'écrase pas ceux des autres sites)
    access_log /var/log/nginx/aujustemotcnv.access.log;
    error_log  /var/log/nginx/aujustemotcnv.error.log;

    # En-têtes de sécurité de base (app same-origin, aucune ressource tierce)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Application mono-page : on retombe sur index.html si l'URI n'existe pas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker doit toujours être revalidé, sinon les mises à jour tardent
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # La coquille HTML ne doit pas être figée en cache
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Type MIME correct pour le manifeste PWA
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Données de référence (mises à jour avec l'app) : pas de cache long
    location = /donnees-emotions.json {
        add_header Cache-Control "no-cache" always;
    }

    # Ressources immuables (icônes) : cache long
    location ~* \.(png|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
